<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microinterações - Efeitos CSS</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/background-color.css" />
  </head>
  <body>
    <!-- Demonstração de Rotação[cite: 12] -->
    <div class="caixa-giratoria bg efeito-suave">Passe o mouse!</div>

      caixa.style.backgroundColor = 'yellow';
