<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Segurança e Validação - Módulo 11</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h2>4. O Coração da Aplicação (Segurança e Validação)</h2>

    <div class="container-form">
      <!-- INICIE A LIVE COM O METHOD="GET". DEPOIS MUDE PARA "POST" -->
      <form id="formSeguro" method="POST" action="">
        <label for="nome">Nome Completo:</label>
        <!-- O atributo placeholder guia o usuário -->
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Ex: João da Silva"
        />
        <span id="erroNome" class="erro-msg">O nome não pode ficar vazio!</span>

        <label for="senha">Senha de Acesso:</label>
        <input
          type="password"
          id="senha"
          name="senha"
          placeholder="Digite sua senha secreta"
        />
        <span id="erroSenha" class="erro-msg">A senha é obrigatória!</span>

        <button type="submit">Entrar no Sistema</button>
      </form>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>
