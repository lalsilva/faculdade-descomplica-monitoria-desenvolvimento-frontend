<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onde os Dados Nascem - Módulo 10</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h2>3. Onde os Dados Nascem (Formulários)</h2>

    <form action="">
      <!-- Agrupando dados relacionados visualmente[cite: 7, 8] -->
      <fieldset>
        <legend>Dados Cadastrais</legend>

        <!-- Acessibilidade: O "for" do label conecta ao "id" do input[cite: 7, 8] -->
        <label for="nomeUser">Nome Completo:</label>
        <input
          type="text"
          id="nomeUser"
          name="nome"
          placeholder="Digite seu nome"
        />

        <!-- Type="email" traz validação nativa e muda o teclado do celular[cite: 7, 8] -->
        <label for="emailUser">E-mail Profissional:</label>
        <input
          type="email"
          id="emailUser"
          name="email"
          placeholder="nome@empresa.com.br"
        />

        <!-- Type="date" abre o calendário nativo[cite: 7, 8] -->
        <label for="dataUser">Data de Nascimento:</label>
        <input type="date" id="dataUser" name="data_nascimento" />
      </fieldset>

      <fieldset>
        <legend>Conhecimentos Técnicos</legend>

        <label for="linguagens"
          >Linguagens de Programação (Dica da Atividade!):</label
        >
        <!-- DICA: Mostre a lista normal e depois adicione o size="4" ao vivo -->
        <select id="linguagens" name="linguagens" multiple>
          <option value="html">HTML5</option>
          <option value="css">CSS3</option>
          <option value="js">JavaScript</option>
          <option value="java">Java (A alegria do Back-end)</option>
        </select>
      </fieldset>

      <!-- Botões com diferentes propósitos e estados[cite: 7, 8] -->
      <button type="submit">Salvar Cadastro</button>
      <button type="button" disabled>Botão Desabilitado</button>
    </form>
  </body>
</html>
